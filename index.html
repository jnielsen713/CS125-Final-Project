<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Youth Group Manager</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
      // Define placeholder components for the Lucide icons
      const Users = (props) => <span {...props} style={{fontSize: props.size/20 + 'em'}}>👥</span>;
      const Calendar = (props) => <span {...props} style={{fontSize: props.size/20 + 'em'}}>📅</span>;
      const UserPlus = (props) => <span {...props} style={{fontSize: props.size/20 + 'em'}}>➕</span>;
      const CheckCircle = (props) => <span {...props} style={{fontSize: props.size/20 + 'em'}}>✅</span>;
      const ClipboardList = (props) => <span {...props} style={{fontSize: props.size/20 + 'em'}}>📋</span>;
      const Activity = (props) => <span {...props} style={{fontSize: props.size/20 + 'em'}}>⚡</span>;
      const Home = (props) => <span {...props} style={{fontSize: props.size/20 + 'em'}}>🏠</span>;
      const Bell = (props) => <span {...props} style={{fontSize: props.size/20 + 'em'}}>🔔</span>;
      const Settings = (props) => <span {...props} style={{fontSize: props.size/20 + 'em'}}>⚙️</span>; 
      
      const { useState, useEffect } = React;
      
      const API_BASE = 'http://127.0.0.1:5000';

      const YouthGroupApp = () => {
        const [activeView, setActiveView] = useState('dashboard');
        const [liveData, setLiveData] = useState(null);
        const [refreshKey, setRefreshKey] = useState(0);

        // Fetch live dashboard data
        useEffect(() => {
          if (activeView === 'dashboard') {
            fetchLiveDashboard();
            const interval = setInterval(fetchLiveDashboard, 5000); // Refresh every 5 seconds
            return () => clearInterval(interval);
          }
        }, [activeView, refreshKey]);

        const fetchLiveDashboard = async () => {
          try {
            const res = await fetch(`${API_BASE}/dashboard/live`);
            const data = await res.json();
            setLiveData(data);
          } catch (err) {
            console.error('Error fetching live dashboard:', err);
          }
        };

        const NavButton = ({ icon: Icon, label, view }) => (
          <button onClick={() => setActiveView(view)}
            className={`flex items-center gap-2 px-4 py-2 rounded-lg transition-all ${
              activeView === view
                ? 'bg-blue-600 text-white shadow-lg'
                : 'bg-white text-blue-600 hover:bg-blue-50'
            }`}
          >
            <Icon size={20} />
            <span className="font-medium">{label}</span>
          </button>
        );

        return (
          <div className="min-h-screen bg-gradient-to-br from-blue-50 via-cyan-50 to-teal-50">
            {/* Header */}
            <header className="bg-gradient-to-r from-blue-600 to-cyan-600 text-white shadow-lg">
              <div className="container mx-auto px-6 py-4">
                <h1 className="text-3xl font-bold">Youth Group Manager</h1>
                <p className="text-blue-100 text-sm">Empowering youth ministry through technology</p>
              </div>
            </header>

            {/* Navigation */}
            <nav className="bg-white shadow-md border-b-2 border-blue-100">
              <div className="container mx-auto px-6 py-4">
                <div className="flex flex-wrap gap-3">
                  <NavButton icon={Home} label="Dashboard" view="dashboard" />
                  <NavButton icon={Users} label="Students" view="students" />
                  <NavButton icon={UserPlus} label="Parents" view="parents" />
                  <NavButton icon={Calendar} label="Events" view="events" />
                  <NavButton icon={CheckCircle} label="Check-In" view="checkin" />
                  <NavButton icon={ClipboardList} label="Small Groups" view="groups" />
                  <NavButton icon={Bell} label="Event Notes" view="notes" />
                  <NavButton icon={Settings} label="Event Config" view="event-config" /> 
                </div>
              </div>
            </nav>

            {/* Main Content */}
            <main className="container mx-auto px-6 py-8">
              {activeView === 'dashboard' && <DashboardView liveData={liveData} />}
              {activeView === 'students' && <StudentsView />}
              {activeView === 'parents' && <ParentsView />}
              {activeView === 'events' && <EventsView onRefresh={() => setRefreshKey(k => k + 1)} />}
              {activeView === 'checkin' && <CheckInView onRefresh={() => setRefreshKey(k => k + 1)} />}
              {activeView === 'groups' && <SmallGroupsView />}
              {activeView === 'notes' && <EventNotesView />}
              {activeView === 'event-config' && <EventTypesView />} 
            </main>
          </div>
        );
      };

      // Dashboard View (Unchanged)
      const DashboardView = ({ liveData }) => {
        return (
          <div className="space-y-6">
            <div className="bg-white rounded-xl shadow-lg p-6 border-2 border-blue-100">
              <div className="flex items-center gap-3 mb-4">
                <Activity className="text-blue-600" size={32} />
                <h2 className="text-2xl font-bold text-gray-800">Live Dashboard</h2>
              </div>
              
              {liveData ? (
                <div className="space-y-6">
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div className="bg-gradient-to-br from-blue-500 to-blue-600 rounded-lg p-6 text-white">
                      <div className="text-3xl font-bold">{liveData.number_of_active_events || 0}</div>
                      <div className="text-blue-100">Active Events</div>
                    </div>
                    <div className="bg-gradient-to-br from-cyan-500 to-cyan-600 rounded-lg p-6 text-white">
                      <div className="text-3xl font-bold">{liveData.total_people_across_all_events || 0}</div>
                      <div className="text-cyan-100">Total Attendees</div>
                    </div>
                    <div className="bg-gradient-to-br from-teal-500 to-teal-600 rounded-lg p-6 text-white">
                      <div className="text-3xl font-bold">{new Date().toLocaleTimeString()}</div>
                      <div className="text-teal-100">Current Time</div>
                    </div>
                  </div>

                  {liveData.active_events && liveData.active_events.length > 0 ? (
                    <div className="space-y-4">
                      <h3 className="text-xl font-semibold text-gray-800">Currently Active Events</h3>
                      {liveData.active_events.map(event => (
                        <div key={event.event_id} className="bg-blue-50 rounded-lg p-4 border-l-4 border-blue-500">
                          <div className="flex justify-between items-start mb-3">
                            <div>
                              <h4 className="text-lg font-bold text-gray-800">{event.event_name}</h4>
                              <p className="text-sm text-gray-600">{event.location}</p>
                              <p className="text-xs text-gray-500">Started: {new Date(event.start_time).toLocaleString()}</p>
                            </div>
                            <div className="bg-blue-600 text-white px-4 py-2 rounded-full font-bold">
                              {event.current_attendance} checked in
                            </div>
                          </div>
                          <div className="flex flex-wrap gap-2">
                            {event.students.map(student => (
                              <span key={student.id} className="bg-white px-3 py-1 rounded-full text-sm text-gray-700 border border-blue-200">
                                {student.name}
                              </span>
                            ))}
                          </div>
                        </div>
                      ))}
                    </div>
                  ) : (
                    <div className="text-center py-12 text-gray-500">
                      <Activity size={48} className="mx-auto mb-4 opacity-50" />
                      <p className="text-lg">No active events right now</p>
                    </div>
                  )}
                </div>
              ) : (
                <div className="text-center py-12">
                  <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mx-auto"></div>
                  <p className="mt-4 text-gray-600">Loading live data...</p>
                </div>
              )}
            </div>
          </div>
        );
      };

      // Students View (Unchanged)
      const StudentsView = () => {
        const [students, setStudents] = useState([]);
        const [selectedStudent, setSelectedStudent] = useState(null);
        const [parents, setParents] = useState([]);
        const [loading, setLoading] = useState(true);

        useEffect(() => {
          fetchStudents();
        }, []);

        const fetchStudents = async () => {
          setLoading(true);
          try {
            const res = await fetch(`${API_BASE}/students`);
            const data = await res.json();
            setStudents(data);
          } catch (err) {
            console.error('Error fetching students:', err);
          }
          setLoading(false);
        };

        const viewStudentParents = async (studentId) => {
          try {
            const res = await fetch(`${API_BASE}/student/${studentId}/parents`);
            const data = await res.json();
            setParents(data);
            setSelectedStudent(studentId);
          } catch (err) {
            console.error('Error fetching parents:', err);
          }
        };

        if (loading) {
          return <div className="text-center py-12">Loading students...</div>;
        }

        return (
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div className="bg-white rounded-xl shadow-lg p-6 border-2 border-blue-100">
              <h2 className="text-2xl font-bold text-gray-800 mb-4 flex items-center gap-2">
                <Users className="text-blue-600" />
                Students ({students.length})
              </h2>
              <div className="space-y-2 max-h-[600px] overflow-y-auto">
                {students.map(student => (
                  <div
                    key={student[0]}
                    onClick={() => viewStudentParents(student[0])}
                    className="p-4 bg-blue-50 rounded-lg hover:bg-blue-100 cursor-pointer transition-colors border border-blue-200"
                  >
                    <div className="font-semibold text-gray-800">{student[1]} {student[2]}</div>
                    <div className="text-sm text-gray-600">{student[3]}</div>
                    <div className="text-sm text-gray-500">{student[4]}</div>
                    {student[5] && <div className="text-xs text-gray-500">Birthday: {new Date(student[5]).toLocaleDateString()}</div>}
                  </div>
                ))}
              </div>
            </div>

            <div className="bg-white rounded-xl shadow-lg p-6 border-2 border-blue-100">
              <h2 className="text-2xl font-bold text-gray-800 mb-4">Parents/Guardians</h2>
              {selectedStudent ? (
                <div className="space-y-2">
                  {parents.length > 0 ? (
                    parents.map(parent => (
                      <div key={parent[0]} className="p-4 bg-cyan-50 rounded-lg border border-cyan-200">
                        <div className="font-semibold text-gray-800">{parent[1]} {parent[2]}</div>
                        <div className="text-sm text-gray-600">{parent[3]}</div>
                        <div className="text-sm text-gray-500">{parent[4]}</div>
                      </div>
                    ))
                  ) : (
                    <p className="text-gray-500 text-center py-8">No parents/guardians on record</p>
                  )}
                </div>
              ) : (
                <p className="text-gray-500 text-center py-8">Select a student to view their parents/guardians</p>
              )}
            </div>
          </div>
        );
      };

      // Parents View (Unchanged)
      const ParentsView = () => {
        const [parents, setParents] = useState([]);
        const [selectedParent, setSelectedParent] = useState(null);
        const [children, setChildren] = useState([]);
        const [loading, setLoading] = useState(true);

        useEffect(() => {
          fetchParents();
        }, []);

        const fetchParents = async () => {
          setLoading(true);
          try {
            const res = await fetch(`${API_BASE}/parents`);
            const data = await res.json();
            setParents(data);
          } catch (err) {
            console.error('Error fetching parents:', err);
          }
          setLoading(false);
        };

        const viewParentChildren = async (parentId) => {
          try {
            const res = await fetch(`${API_BASE}/parent/${parentId}/children`);
            const data = await res.json();
            setChildren(data);
            setSelectedParent(parentId);
          } catch (err) {
            console.error('Error fetching children:', err);
          }
        };

        if (loading) {
          return <div className="text-center py-12">Loading parents...</div>;
        }

        return (
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div className="bg-white rounded-xl shadow-lg p-6 border-2 border-blue-100">
              <h2 className="text-2xl font-bold text-gray-800 mb-4 flex items-center gap-2">
                <UserPlus className="text-blue-600" />
                Parents/Guardians ({parents.length})
              </h2>
              <div className="space-y-2 max-h-[600px] overflow-y-auto">
                {parents.map(parent => (
                  <div
                    key={parent[0]}
                    onClick={() => viewParentChildren(parent[0])}
                    className="p-4 bg-cyan-50 rounded-lg hover:bg-cyan-100 cursor-pointer transition-colors border border-cyan-200"
                  >
                    <div className="font-semibold text-gray-800">{parent[1]} {parent[2]}</div>
                    <div className="text-sm text-gray-600">{parent[3]}</div>
                    <div className="text-sm text-gray-500">{parent[4]}</div>
                  </div>
                ))}
              </div>
            </div>

            <div className="bg-white rounded-xl shadow-lg p-6 border-2 border-blue-100">
              <h2 className="text-2xl font-bold text-gray-800 mb-4">Children</h2>
              {selectedParent ? (
                <div className="space-y-2">
                  {children.length > 0 ? (
                    children.map(child => (
                      <div key={child[0]} className="p-4 bg-blue-50 rounded-lg border border-blue-200">
                        <div className="font-semibold text-gray-800">{child[1]} {child[2]}</div>
                        <div className="text-sm text-gray-600">{child[4]}</div>
                        {child[3] && <div className="text-xs text-gray-500">Birthday: {new Date(child[3]).toLocaleDateString()}</div>}
                      </div>
                    ))
                  ) : (
                    <p className="text-gray-500 text-center py-8">No children on record</p>
                  )}
                </div>
              ) : (
                <p className="text-gray-500 text-center py-8">Select a parent to view their children</p>
              )}
            </div>
          </div>
        );
      };

      // Events View (Unchanged)
      const EventsView = ({ onRefresh }) => {
        const [events, setEvents] = useState([]);
        const [selectedEvent, setSelectedEvent] = useState(null);
        const [registrations, setRegistrations] = useState([]);
        const [loading, setLoading] = useState(true);

        useEffect(() => {
          fetchEvents();
        }, []);

        const fetchEvents = async () => {
          setLoading(true);
          try {
            const res = await fetch(`${API_BASE}/upcoming-events`);
            const data = await res.json();
            setEvents(data);
          } catch (err) {
            console.error('Error fetching events:', err);
          }
          setLoading(false);
        };

        const viewEventRegistrations = async (eventId) => {
          try {
            const res = await fetch(`${API_BASE}/event/${eventId}/registrations`);
            const data = await res.json();
            setRegistrations(data);
            setSelectedEvent(eventId);
          } catch (err) {
            console.error('Error fetching registrations:', err);
          }
        };

        if (loading) {
          return <div className="text-center py-12">Loading events...</div>;
        }

        return (
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div className="bg-white rounded-xl shadow-lg p-6 border-2 border-blue-100">
              <h2 className="text-2xl font-bold text-gray-800 mb-4 flex items-center gap-2">
                <Calendar className="text-blue-600" />
                Upcoming Events ({events.length})
              </h2>
              <div className="space-y-3 max-h-[600px] overflow-y-auto">
                {events.map(event => (
                  <div
                    key={event[0]}
                    onClick={() => viewEventRegistrations(event[0])}
                    className="p-4 bg-gradient-to-r from-blue-50 to-cyan-50 rounded-lg hover:from-blue-100 hover:to-cyan-100 cursor-pointer transition-all border border-blue-200 shadow-sm"
                  >
                    <div className="font-bold text-lg text-gray-800">{event[1]}</div>
                    <div className="text-sm text-gray-600 mt-1">{new Date(event[2]).toLocaleString()}</div>
                    <div className="text-sm text-gray-700 mt-1 flex items-center gap-1">
                      <span className="text-blue-600">📍</span> {event[3]}
                    </div>
                  </div>
                ))}
              </div>
            </div>

            <div className="bg-white rounded-xl shadow-lg p-6 border-2 border-blue-100">
              <h2 className="text-2xl font-bold text-gray-800 mb-4">Registrations</h2>
              {selectedEvent ? (
                <div className="space-y-2">
                  <div className="bg-blue-100 text-blue-800 px-4 py-2 rounded-lg font-semibold mb-3">
                    Total Registered: {registrations.length}
                  </div>
                  {registrations.length > 0 ? (
                    registrations.map(reg => (
                      <div key={reg[0]} className="p-3 bg-cyan-50 rounded-lg border border-cyan-200">
                        <div className="font-semibold text-gray-800">{reg[1]} {reg[2]}</div>
                        <div className="text-sm text-gray-600">{reg[3]}</div>
                        <div className="text-xs text-gray-500 mt-1">Registered: {new Date(reg[5]).toLocaleString()}</div>
                      </div>
                    ))
                  ) : (
                    <p className="text-gray-500 text-center py-8">No registrations yet</p>
                  )}
                </div>
              ) : (
                <p className="text-gray-500 text-center py-8">Select an event to view registrations</p>
              )}
            </div>
          </div>
        );
      };

      // Check-In View (Unchanged)
      const CheckInView = ({ onRefresh }) => {
        const [events, setEvents] = useState([]);
        const [students, setStudents] = useState([]);
        const [selectedEvent, setSelectedEvent] = useState(null);
        const [checkinStatus, setCheckinStatus] = useState(null);
        const [message, setMessage] = useState('');

        useEffect(() => {
          fetchUpcomingEvents();
          fetchStudents();
        }, []);

        const fetchUpcomingEvents = async () => {
          try {
            const res = await fetch(`${API_BASE}/upcoming-events`);
            const data = await res.json();
            setEvents(data);
          } catch (err) {
            console.error('Error fetching events:', err);
          }
        };

        const fetchStudents = async () => {
          try {
            const res = await fetch(`${API_BASE}/students`);
            const data = await res.json();
            setStudents(data);
          } catch (err) {
            console.error('Error fetching students:', err);
          }
        };

        const fetchCheckinStatus = async (eventId) => {
          try {
            const res = await fetch(`${API_BASE}/event/${eventId}/checkin/status`);
            const data = await res.json();
            setCheckinStatus(data);
          } catch (err) {
            console.error('Error fetching check-in status:', err);
          }
        };

        const handleEventSelect = (eventId) => {
          setSelectedEvent(eventId);
          fetchCheckinStatus(eventId);
        };

        const checkinStudent = async (studentId) => {
          if (!selectedEvent) {
            setMessage('Please select an event first');
            return;
          }

          try {
            const res = await fetch(`${API_BASE}/event/${selectedEvent}/checkin/${studentId}`, {
              method: 'POST'
            });
            const data = await res.json();
            
            if (data.success) {
              setMessage(`✓ Checked in successfully!`);
              fetchCheckinStatus(selectedEvent);
              onRefresh();
              setTimeout(() => setMessage(''), 3000);
            }
          } catch (err) {
            setMessage('Error checking in student');
            console.error('Error:', err);
          }
        };

        const checkoutStudent = async (studentId) => {
          if (!selectedEvent) return;

          try {
            const res = await fetch(`${API_BASE}/event/${selectedEvent}/checkout/${studentId}`, {
              method: 'POST'
            });
            const data = await res.json();
            
            if (data.success) {
              setMessage(`✓ Checked out successfully!`);
              fetchCheckinStatus(selectedEvent);
              onRefresh();
              setTimeout(() => setMessage(''), 3000);
            }
          } catch (err) {
            setMessage('Error checking out student');
            console.error('Error:', err);
          }
        };

        const finalizeEvent = async () => {
          if (!selectedEvent) return;

          if (!confirm('Finalize this event? This will save all check-ins to the database and clear live tracking.')) {
            return;
          }

          try {
            const res = await fetch(`${API_BASE}/event/${selectedEvent}/finalize`, {
              method: 'POST'
            });
            const data = await res.json();
            
            if (data.success) {
              setMessage(`✓ Event finalized! ${data.records_saved} records saved.`);
              setCheckinStatus(null);
              setSelectedEvent(null);
              onRefresh();
              setTimeout(() => setMessage(''), 5000);
            }
          } catch (err) {
            setMessage('Error finalizing event');
            console.error('Error:', err);
          }
        };

        return (
          <div className="space-y-6">
            {message && (
              <div className="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded-lg">
                {message}
              </div>
            )}

            <div className="bg-white rounded-xl shadow-lg p-6 border-2 border-blue-100">
              <h2 className="text-2xl font-bold text-gray-800 mb-4 flex items-center gap-2">
                <CheckCircle className="text-blue-600" />
                Event Check-In System
              </h2>
              
              <div className="mb-6">
                <label className="block text-sm font-semibold text-gray-700 mb-2">Select Event</label>
                <select
                  value={selectedEvent || ''}
                  onChange={(e) => handleEventSelect(Number(e.target.value))}
                  className="w-full p-3 border-2 border-blue-200 rounded-lg focus:border-blue-500 focus:outline-none"
                >
                  <option value="">Choose an event...</option>
                  {events.map(event => (
                    <option key={event[0]} value={event[0]}>
                      {event[1]} - {new Date(event[2]).toLocaleDateString()}
                    </option>
                  ))}
                </select>
              </div>

              {selectedEvent && checkinStatus && (
                <div className="mb-6 p-4 bg-blue-50 rounded-lg border border-blue-200">
                  <div className="flex justify-between items-center">
                    <div>
                      <div className="font-bold text-2xl text-blue-700">{checkinStatus.total_checked_in}</div>
                      <div className="text-sm text-gray-600">Currently Checked In</div>
                    </div>
                    <button
                      onClick={finalizeEvent}
                      className="bg-gradient-to-r from-teal-500 to-teal-600 text-white px-6 py-3 rounded-lg font-semibold hover:from-teal-600 hover:to-teal-700 transition-all shadow-lg"
                    >
                      Finalize Event
                    </button>
                  </div>
                </div>
              )}
            </div>

            {selectedEvent && (
              <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div className="bg-white rounded-xl shadow-lg p-6 border-2 border-blue-100">
                  <h3 className="text-xl font-bold text-gray-800 mb-4">Check In Students</h3>
                  <div className="space-y-2 max-h-[500px] overflow-y-auto">
                    {students.map(student => {
                      const isCheckedIn = checkinStatus?.student_Ids?.includes(String(student[0]));
                      return (
                        <div
                          key={student[0]}
                          className={`p-3 rounded-lg border-2 flex justify-between items-center ${
                            isCheckedIn
                              ? 'bg-green-50 border-green-300'
                              : 'bg-gray-50 border-gray-200'
                          }`}
                        >
                          <div>
                            <div className="font-semibold text-gray-800">{student[1]} {student[2]}</div>
                            <div className="text-xs text-gray-500">{student[3]}</div>
                          </div>
                          {isCheckedIn ? (
                            <button
                              onClick={() => checkoutStudent(student[0])}
                              className="bg-red-500 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-red-600 transition-colors"
                            >
                              Check Out
                            </button>
                          ) : (
                            <button
                              onClick={() => checkinStudent(student[0])}
                              className="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-blue-700 transition-colors"
                            >
                              Check In
                            </button>
                          )}
                        </div>
                      );
                    })}
                  </div>
                </div>

                <div className="bg-white rounded-xl shadow-lg p-6 border-2 border-blue-100">
                  <h3 className="text-xl font-bold text-gray-800 mb-4">Checked In Now</h3>
                  {checkinStatus && checkinStatus.student_Ids && checkinStatus.student_Ids.length > 0 ? (
                    <div className="space-y-2">
                      {checkinStatus.student_Ids.map(studentId => {
                        const student = students.find(s => s[0] === Number(studentId));
                        const checkInTime = checkinStatus.check_in_times?.[studentId];
                        return student ? (
                          <div key={studentId} className="p-3 bg-green-50 rounded-lg border border-green-200">
                            <div className="font-semibold text-gray-800">{student[1]} {student[2]}</div>
                            {checkInTime && (
                              <div className="text-xs text-gray-500 mt-1">
                                Checked in at: {new Date(checkInTime).toLocaleTimeString()}
                              </div>
                            )}
                          </div>
                        ) : null;
                      })}
                    </div>
                  ) : (
                    <p className="text-gray-500 text-center py-8">No one checked in yet</p>
                  )}
                </div>
              </div>
            )}
          </div>
        );
      };

      // **FIXED** Small Groups View
      const SmallGroupsView = () => {
        const [groups, setGroups] = useState([]);
        const [students, setStudents] = useState([]); // All students
        const [selectedGroup, setSelectedGroup] = useState(null);
        const [members, setMembers] = useState([]);
        const [loading, setLoading] = useState(true);
        const [message, setMessage] = useState('');

        useEffect(() => {
          fetchGroups();
          fetchStudents();
        }, []);

        const fetchStudents = async () => {
          try {
            const res = await fetch(`${API_BASE}/students`);
            const data = await res.json(); 
            setStudents(data);
          } catch (err) {
            console.error('Error fetching students:', err);
          }
        };

        const fetchGroups = async () => {
          setLoading(true);
          try {
            const res = await fetch(`${API_BASE}/smallgroups`);
            const data = await res.json();
            setGroups(data);
          } catch (err) {
            console.error('Error fetching groups:', err);
          }
          setLoading(false);
        };

        const viewGroupMembers = async (groupId) => {
          setMembers([]);
          try {
            const res = await fetch(`${API_BASE}/smallgroup/${groupId}/members`);
            const data = await res.json();
            setMembers(data);
            setSelectedGroup(groupId);
          } catch (err) {
            console.error('Error fetching members:', err);
          }
        };
        
        const updateGroupMembership = async (studentId, action) => {
          if (!selectedGroup) return;

          const endpoint = action === 'add' ? 'add-student' : 'remove-student';
          // THE FIX: Use POST for adding, DELETE for removing
          const httpMethod = action === 'add' ? 'POST' : 'DELETE'; 
          
          try {
            const res = await fetch(`${API_BASE}/smallgroup/${selectedGroup}/${endpoint}/${studentId}`, {
                method: httpMethod // Use the determined HTTP method
            });

            if (!res.ok) {
                let errorText = `Failed to ${action} student. Status: ${res.status}`;
                try {
                    const errorData = await res.json();
                    errorText = errorData.error || errorText;
                } catch (e) {
                    // This will catch the 405 error if Flask doesn't return JSON
                    errorText = `Server responded with non-JSON content. Status: ${res.status}. Check Flask endpoints.`;
                }
                setMessage(`Error: ${errorText}`);
                setTimeout(() => setMessage(''), 5000);
                return;
            }

            const data = await res.json();
            
            if (data.success) {
                setMessage(`✓ Student ${action === 'add' ? 'added to' : 'removed from'} group ${selectedGroup}.`);
                viewGroupMembers(selectedGroup); // Refresh members list
                setTimeout(() => setMessage(''), 3000);
            } else {
                 setMessage(`Operation Failed: ${data.message || 'Unknown issue.'}`);
                 setTimeout(() => setMessage(''), 5000);
            }

          } catch (err) {
            setMessage('Network or parsing error occurred.');
            console.error('Error:', err);
            setTimeout(() => setMessage(''), 5000);
          }
        };

        if (loading) {
          return <div className="text-center py-12">Loading small groups...</div>;
        }
        
        const currentMemberIds = new Set(members.map(member => String(member[0])));

        return (
          <div className="space-y-6">
            {message && (
              <div className="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded-lg">
                {message}
              </div>
            )}
            
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
              {/* Group Selection */}
              <div className="lg:col-span-1 bg-white rounded-xl shadow-lg p-6 border-2 border-blue-100">
                <h2 className="text-2xl font-bold text-gray-800 mb-4 flex items-center gap-2">
                  <ClipboardList className="text-blue-600" />
                  Small Groups
                </h2>
                <div className="space-y-3 max-h-[600px] overflow-y-auto">
                  {groups.map((group, idx) => (
                    // The smallgroup endpoint uses the index+1 as the ID
                    <div
                      key={idx}
                      onClick={() => viewGroupMembers(idx + 1)}
                      className={`p-4 rounded-lg cursor-pointer transition-all border shadow-sm 
                        ${selectedGroup === idx + 1 ? 'bg-blue-100 border-blue-400' : 'bg-gradient-to-r from-teal-50 to-cyan-50 hover:from-teal-100 hover:to-cyan-100 border-teal-200'}`}
                    >
                      <div className="font-bold text-lg text-gray-800">{group[0]}</div>
                      <div className="text-sm text-gray-600 mt-1">{group[1]}</div>
                    </div>
                  ))}
                </div>
              </div>
              
              {/* Group Members List */}
              <div className="lg:col-span-2 bg-white rounded-xl shadow-lg p-6 border-2 border-blue-100">
                <h2 className="text-2xl font-bold text-gray-800 mb-4">Group Members</h2>
                {selectedGroup ? (
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {/* List of current members */}
                    <div>
                      <h3 className="text-xl font-semibold text-gray-700 mb-3">Current Members ({members.length})</h3>
                      <div className="space-y-2 max-h-[400px] overflow-y-auto">
                        {members.length > 0 ? (
                          members.map(member => (
                            <div key={member[0]} className="p-3 bg-cyan-50 rounded-lg border border-cyan-200 flex justify-between items-center">
                              <div>
                                <div className="font-semibold text-gray-800">{member[1]} {member[2]}</div>
                                <div className="text-sm text-gray-600">{member[3]}</div>
                              </div>
                              <button 
                                onClick={() => updateGroupMembership(member[0], 'remove')}
                                className="bg-red-500 text-white px-3 py-1 rounded-lg text-sm hover:bg-red-600 transition-colors"
                              >
                                Remove
                              </button>
                            </div>
                          ))
                        ) : (
                          <p className="text-gray-500 text-center py-8">No members in this group</p>
                        )}
                      </div>
                    </div>
                    
                    {/* List of non-members for adding */}
                    <div>
                      <h3 className="text-xl font-semibold text-gray-700 mb-3">Available Students ({students.length - members.length})</h3>
                      <div className="space-y-2 max-h-[400px] overflow-y-auto">
                        {students.filter(s => !currentMemberIds.has(String(s[0]))).map(student => (
                          <div key={student[0]} className="p-3 bg-blue-50 rounded-lg border border-blue-200 flex justify-between items-center">
                            <div>
                              <div className="font-semibold text-gray-800">{student[1]} {student[2]}</div>
                              <div className="text-sm text-gray-600">{student[3]}</div>
                            </div>
                            <button 
                              onClick={() => updateGroupMembership(student[0], 'add')}
                              className="bg-blue-600 text-white px-3 py-1 rounded-lg text-sm hover:bg-blue-700 transition-colors"
                            >
                              Add
                            </button>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                ) : (
                  <p className="text-gray-500 text-center py-8">Select a group to manage members</p>
                )}
              </div>
            </div>
          </div>
        );
      };

      // Event Notes View (Unchanged)
      const EventNotesView = () => {
        const [events, setEvents] = useState([]);
        const [selectedEvent, setSelectedEvent] = useState(null);
        const [notes, setNotes] = useState([]);
        const [newNote, setNewNote] = useState('');
        const [author, setAuthor] = useState('');
        const [message, setMessage] = useState('');

        useEffect(() => {
          fetchEvents();
        }, []);

        const fetchEvents = async () => {
          try {
            const res = await fetch(`${API_BASE}/events`);
            const data = await res.json();
            setEvents(data);
          } catch (err) {
            console.error('Error fetching events:', err);
          }
        };

        const fetchNotes = async (eventId) => {
          try {
            const res = await fetch(`${API_BASE}/event/${eventId}/notes`);
            const data = await res.json();
            setNotes(data.event_notes[0]?.notes || []);
          } catch (err) {
            console.error('Error fetching notes:', err);
            setNotes([]);
          }
        };

        const handleEventSelect = (eventId) => {
          setSelectedEvent(eventId);
          fetchNotes(eventId);
        };

        const addNote = async () => {
          if (!selectedEvent || !newNote.trim()) {
            setMessage('Please select an event and enter a note');
            return;
          }

          try {
            const res = await fetch(`${API_BASE}/event/${selectedEvent}/notes`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                content: newNote,
                author: author || 'Anonymous',
                tags: []
              })
            });

            const data = await res.json();
            
            if (data.message) {
              setMessage('✓ Note added successfully!');
              setNewNote('');
              fetchNotes(selectedEvent);
              setTimeout(() => setMessage(''), 3000);
            }
          } catch (err) {
            setMessage('Error adding note');
            console.error('Error:', err);
          }
        };

        return (
          <div className="space-y-6">
            {message && (
              <div className="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded-lg">
                {message}
              </div>
            )}

            <div className="bg-white rounded-xl shadow-lg p-6 border-2 border-blue-100">
              <h2 className="text-2xl font-bold text-gray-800 mb-4 flex items-center gap-2">
                <Bell className="text-blue-600" />
                Event Notes
              </h2>
              
              <div className="mb-6">
                <label className="block text-sm font-semibold text-gray-700 mb-2">Select Event</label>
                <select
                  value={selectedEvent || ''}
                  onChange={(e) => handleEventSelect(Number(e.target.value))}
                  className="w-full p-3 border-2 border-blue-200 rounded-lg focus:border-blue-500 focus:outline-none"
                >
                  <option value="">Choose an event...</option>
                  {events.map(event => (
                    <option key={event[0]} value={event[0]}>
                      {event[1]} - {new Date(event[2]).toLocaleDateString()}
                    </option>
                  ))}
                </select>
              </div>

              {selectedEvent && (
                <div className="space-y-4">
                  <div className="bg-blue-50 p-4 rounded-lg border border-blue-200">
                    <label className="block text-sm font-semibold text-gray-700 mb-2">Your Name (Optional)</label>
                    <input
                      type="text"
                      value={author}
                      onChange={(e) => setAuthor(e.target.value)}
                      placeholder="Enter your name..."
                      className="w-full p-2 border-2 border-blue-200 rounded-lg mb-3 focus:border-blue-500 focus:outline-none"
                    />
                    
                    <label className="block text-sm font-semibold text-gray-700 mb-2">Note</label>
                    <textarea
                      value={newNote}
                      onChange={(e) => setNewNote(e.target.value)}
                      placeholder="What happened during this event?"
                      rows={4}
                      className="w-full p-3 border-2 border-blue-200 rounded-lg focus:border-blue-500 focus:outline-none"
                    />
                    
                    <button
                      onClick={addNote}
                      className="mt-3 bg-blue-600 text-white px-6 py-2 rounded-lg font-semibold hover:bg-blue-700 transition-colors"
                    >
                      Add Note
                    </button>
                  </div>

                  <div>
                    <h3 className="text-xl font-bold text-gray-800 mb-3">Previous Notes</h3>
                    {notes.length > 0 ? (
                      <div className="space-y-3">
                        {notes.map((note, idx) => (
                          <div key={idx} className="p-4 bg-cyan-50 rounded-lg border border-cyan-200">
                            <div className="flex justify-between items-start mb-2">
                              <span className="font-semibold text-gray-800">{note.author}</span>
                              <span className="text-xs text-gray-500">
                                {new Date(note.timestamp).toLocaleString()}
                              </span>
                            </div>
                            <p className="text-gray-700">{note.content}</p>
                          </div>
                        ))}
                      </div>
                    ) : (
                      <p className="text-gray-500 text-center py-8">No notes yet for this event</p>
                    )}
                  </div>
                </div>
              )}
            </div>
          </div>
        );
      };
      
      // Event Types and Custom Data View (Unchanged)
      const EventTypesView = () => {
        const [eventTypes, setEventTypes] = useState([]);
        const [newTypeName, setNewTypeName] = useState('');
        const [customFieldEventId, setCustomFieldEventId] = useState('');
        const [customFieldKey, setCustomFieldKey] = useState('');
        const [customFieldValue, setCustomFieldValue] = useState('');
        const [message, setMessage] = useState('');

        useEffect(() => {
          fetchEventTypes();
        }, []);

        const fetchEventTypes = async () => {
          try {
            const res = await fetch(`${API_BASE}/event/types`);
            const data = await res.json();
            setEventTypes(data);
          } catch (err) {
            console.error('Error fetching event types:', err);
          }
        };

        const createEventType = async () => {
          if (!newTypeName.trim()) {
            setMessage('Event type name is required.');
            return;
          }

          try {
            const res = await fetch(`${API_BASE}/event/type`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ eventType: newTypeName.trim() })
            });

            const data = await res.json();
            
            if (data.message) {
              setMessage(`✓ Event Type created: ${newTypeName}`);
              setNewTypeName('');
              fetchEventTypes(); // Refresh list
              setTimeout(() => setMessage(''), 3000);
            } else if (data.error) {
              setMessage(`Error: ${data.error}`);
              setTimeout(() => setMessage(''), 5000);
            }
          } catch (err) {
            setMessage('Error creating event type.');
            console.error('Error:', err);
          }
        };

        const createEventCustomData = async () => {
          if (!customFieldEventId || !customFieldKey.trim() || !customFieldValue.trim()) {
            setMessage('All custom field inputs are required.');
            return;
          }

          try {
            const res = await fetch(`${API_BASE}/event/custom-data/${customFieldEventId}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ 
                key: customFieldKey.trim(), 
                value: customFieldValue.trim() 
              })
            });

            const data = await res.json();
            
            if (data.message) {
              setMessage(`✓ Custom field added to Event ${customFieldEventId}`);
              setCustomFieldEventId('');
              setCustomFieldKey('');
              setCustomFieldValue('');
              setTimeout(() => setMessage(''), 3000);
            } else if (data.error) {
              setMessage(`Error: ${data.error}`);
              setTimeout(() => setMessage(''), 5000);
            }
          } catch (err) {
            setMessage('Error adding custom data.');
            console.error('Error:', err);
          }
        };


        return (
          <div className="space-y-6">
            {message && (
              <div className="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded-lg">
                {message}
              </div>
            )}
            
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
              {/* Existing Event Types List */}
              <div className="bg-white rounded-xl shadow-lg p-6 border-2 border-blue-100 lg:col-span-1">
                <h3 className="text-2xl font-bold text-gray-800 mb-4 flex items-center gap-2">
                  <Settings className="text-blue-600" />
                  Existing Event Types
                </h3>
                <div className="space-y-2">
                  {eventTypes.length > 0 ? (
                    eventTypes.map(type => (
                      // Assuming eventType is the field holding the type name
                      <div key={type.eventType || type._id} className="p-3 bg-blue-50 rounded-lg border border-blue-200">
                        <div className="font-semibold text-gray-800">{type.eventType}</div>
                        <div className="text-xs text-gray-500">ID: {type._id}</div>
                      </div>
                    ))
                  ) : (
                    <p className="text-gray-500">No event types found.</p>
                  )}
                </div>
              </div>

              {/* Create New Event Type */}
              <div className="bg-white rounded-xl shadow-lg p-6 border-2 border-cyan-100 lg:col-span-1">
                <h3 className="text-2xl font-bold text-gray-800 mb-4">Create New Event Type</h3>
                <label className="block text-sm font-semibold text-gray-700 mb-2">Event Type Name</label>
                <input
                  type="text"
                  value={newTypeName}
                  onChange={(e) => setNewTypeName(e.target.value)}
                  placeholder="e.g., Small Group, Summer Camp"
                  className="w-full p-3 border-2 border-cyan-200 rounded-lg mb-4 focus:border-cyan-500 focus:outline-none"
                />
                <button
                  onClick={createEventType}
                  className="w-full bg-cyan-600 text-white px-6 py-2 rounded-lg font-semibold hover:bg-cyan-700 transition-colors"
                >
                  Create Type
                </button>
              </div>

              {/* Create Event Custom Data */}
              <div className="bg-white rounded-xl shadow-lg p-6 border-2 border-teal-100 lg:col-span-1">
                <h3 className="text-2xl font-bold text-gray-800 mb-4">Add Event Custom Data</h3>
                
                <label className="block text-sm font-semibold text-gray-700 mb-2">Event ID (MySQL ID)</label>
                <input
                  type="number"
                  value={customFieldEventId}
                  onChange={(e) => setCustomFieldEventId(e.target.value)}
                  placeholder="e.g., 5"
                  className="w-full p-3 border-2 border-teal-200 rounded-lg mb-3 focus:border-teal-500 focus:outline-none"
                />

                <label className="block text-sm font-semibold text-gray-700 mb-2">Custom Field Key</label>
                <input
                  type="text"
                  value={customFieldKey}
                  onChange={(e) => setCustomFieldKey(e.target.value)}
                  placeholder="e.g., BusRoute"
                  className="w-full p-3 border-2 border-teal-200 rounded-lg mb-3 focus:border-teal-500 focus:outline-none"
                />

                <label className="block text-sm font-semibold text-gray-700 mb-2">Custom Field Value</label>
                <input
                  type="text"
                  value={customFieldValue}
                  onChange={(e) => setCustomFieldValue(e.target.value)}
                  placeholder="e.g., North Loop"
                  className="w-full p-3 border-2 border-teal-200 rounded-lg mb-4 focus:border-teal-500 focus:outline-none"
                />
                
                <button
                  onClick={createEventCustomData}
                  className="w-full bg-teal-600 text-white px-6 py-2 rounded-lg font-semibold hover:bg-teal-700 transition-colors"
                >
                  Add Custom Data
                </button>
              </div>
            </div>
          </div>
        );
      };

      // Final rendering call
      const rootElement = document.getElementById('root');
      if (rootElement) {
          ReactDOM.createRoot(rootElement).render(React.createElement(YouthGroupApp));
      }
    </script>
</body>
</html>
