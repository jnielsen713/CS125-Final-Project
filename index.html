<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Youth Group Manager (GraphQL)</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
    // Define placeholder components for the Lucide icons
    const Users = (props) => <span {...props} style={{fontSize: props.size/20 + 'em'}}>👥</span>;
    const Calendar = (props) => <span {...props} style={{fontSize: props.size/20 + 'em'}}>📅</span>;
    const UserPlus = (props) => <span {...props} style={{fontSize: props.size/20 + 'em'}}>➕</span>;
    const CheckCircle = (props) => <span {...props} style={{fontSize: props.size/20 + 'em'}}>✅</span>;
    const ClipboardList = (props) => <span {...props} style={{fontSize: props.size/20 + 'em'}}>📋</span>;
    const Activity = (props) => <span {...props} style={{fontSize: props.size/20 + 'em'}}>⚡</span>;
    const Home = (props) => <span {...props} style={{fontSize: props.size/20 + 'em'}}>🏠</span>;
    const Bell = (props) => <span {...props} style={{fontSize: props.size/20 + 'em'}}>🔔</span>;
    const Settings = (props) => <span {...props} style={{fontSize: props.size/20 + 'em'}}>⚙️</span>; 
    
    const { useState, useEffect } = React;
    
    const API_BASE = 'http://127.0.0.1:5000';
    const GRAPHQL_ENDPOINT = `${API_BASE}/graphql`;

    // ************************************************************
    // GraphQL Fetch Utility
    // ************************************************************
    const graphqlFetch = async (query, variables = {}) => {
      const response = await fetch(GRAPHQL_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query, variables }),
      });

      if (!response.ok) {
        throw new Error(`GraphQL network error: ${response.statusText}`);
      }
      
      const result = await response.json();

      if (result.errors) {
        console.error('GraphQL Errors:', result.errors);
        throw new Error(result.errors.map(e => e.message).join(' | '));
      }

      // Data will be in result.data
      return result.data;
    };

    const YouthGroupApp = () => {
      const [activeView, setActiveView] = useState('dashboard');
      const [liveData, setLiveData] = useState(null);
      const [refreshKey, setRefreshKey] = useState(0);

      // Fetch live dashboard data - REFACTORED TO USE GRAPHQL
      useEffect(() => {
        if (activeView === 'dashboard') {
          fetchLiveDashboard();
          const interval = setInterval(fetchLiveDashboard, 5000); // Refresh every 5 seconds
          return () => clearInterval(interval);
        }
      }, [activeView, refreshKey]);

      // REFACTORED: Queries the new 'liveDashboard' field for consolidated data.
    const fetchLiveDashboard = async () => {
      // NOTE: The query below is completely clean, without any comments inside the backticks.
      const query = `
        query LiveDashboardQuery {
          liveDashboard { 
            numberOfActiveEvents 
            totalPeopleAcrossAllEvents 
            activeEvents { 
              eventId
              eventName
              location
              startTime
              currentAttendance
              students {
                personId 
                firstName 
                lastName 
              }
            }
          }
        }
      `;
      try {
        const data = await graphqlFetch(query);
        // FIX: Set data directly from the liveDashboard field
        setLiveData(data.liveDashboard); 
      } catch (err) {
        console.error('Error fetching live dashboard:', err);
      }
    };

      const NavButton = ({ icon: Icon, label, view }) => (
        <button onClick={() => setActiveView(view)}
          className={`flex items-center gap-2 px-4 py-2 rounded-lg transition-all ${
            activeView === view
              ? 'bg-blue-600 text-white shadow-lg'
              : 'bg-white text-blue-600 hover:bg-blue-50'
          }`}
        >
          <Icon size={20} />
          <span className="font-medium">{label}</span>
        </button>
      );

      return (
        <div className="min-h-screen bg-gradient-to-br from-blue-50 via-cyan-50 to-teal-50">
          {/* Header */}
          <header className="bg-gradient-to-r from-blue-600 to-cyan-600 text-white shadow-lg">
            <div className="container mx-auto px-6 py-4">
              <h1 className="text-3xl font-bold">Youth Group Manager (GraphQL)</h1>
              <p className="text-blue-100 text-sm">Empowering youth ministry through technology</p>
            </div>
          </header>

          {/* Navigation */}
          <nav className="bg-white shadow-md border-b-2 border-blue-100">
            <div className="container mx-auto px-6 py-4">
              <div className="flex flex-wrap gap-3">
                <NavButton icon={Home} label="Dashboard" view="dashboard" />
                <NavButton icon={Users} label="Students" view="students" />
                <NavButton icon={UserPlus} label="Parents" view="parents" />
                <NavButton icon={Calendar} label="Events" view="events" />
                <NavButton icon={CheckCircle} label="Check-In" view="checkin" />
                <NavButton icon={ClipboardList} label="Small Groups" view="groups" />
                <NavButton icon={Bell} label="Event Notes" view="notes" />
                <NavButton icon={Settings} label="Event Config" view="event-config" /> 
              </div>
            </div>
          </nav>

          {/* Main Content */}
          <main className="container mx-auto px-6 py-8">
            {activeView === 'dashboard' && <DashboardView liveData={liveData} />}
            {activeView === 'students' && <StudentsView />}
            {activeView === 'parents' && <ParentsView />}
            {activeView === 'events' && <EventsView />}
            {activeView === 'checkin' && <CheckInView onRefresh={() => setRefreshKey(k => k + 1)} />}
            {activeView === 'groups' && <SmallGroupsView />}
            {activeView === 'notes' && <EventNotesView />}
            {activeView === 'event-config' && <EventConfigView />}
          </main>

          {/* Footer */}
          <footer className="bg-gray-800 text-white p-4 mt-8 text-center text-sm">
            &copy; {new Date().getFullYear()} Youth Group Manager. All rights reserved.
          </footer>
        </div>
      );
    };

    // ************************************************************
    // Dashboard View
    // ************************************************************
    const DashboardView = ({ liveData }) => {
      if (!liveData) {
        return (
          <div className="text-center py-10">
            <Activity className="text-blue-600 mx-auto animate-spin" size={48} />
            <p className="mt-4 text-lg text-gray-600">Loading live dashboard data...</p>
          </div>
        );
      }
      
      // Access fields using camelCase as returned by GraphQL
      const numberOfActiveEvents = liveData.numberOfActiveEvents;
      const totalPeopleAcrossAllEvents = liveData.totalPeopleAcrossAllEvents;

      return (
        <div className="bg-white shadow-xl rounded-xl p-6">
          <div className="flex items-center gap-3 mb-4">
            <Activity className="text-blue-600" size={32} />
            <h2 className="text-2xl font-bold text-gray-800">Live Dashboard</h2>
          </div>
          
          <div className="space-y-6">
            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
              {/* Active Events Card */}
              <div className="bg-gradient-to-br from-blue-500 to-blue-600 rounded-lg p-6 text-white shadow-lg relative">
                <div className="text-sm opacity-80 font-medium">Active Events</div>
                <div className="text-4xl font-extrabold mt-1">{numberOfActiveEvents}</div>
                <Calendar className="absolute bottom-4 right-4 opacity-20" size={48} />
              </div>

              {/* Total Attendees Card */}
              <div className="bg-gradient-to-br from-cyan-500 to-teal-600 rounded-lg p-6 text-white shadow-lg relative">
                <div className="text-sm opacity-80 font-medium">Total Checked In</div>
                <div className="text-4xl font-extrabold mt-1">{totalPeopleAcrossAllEvents}</div>
                <Users className="absolute bottom-4 right-4 opacity-20" size={48} />
              </div>

              {/* Placeholder Card */}
              <div className="bg-gradient-to-br from-gray-300 to-gray-400 rounded-lg p-6 text-gray-800 shadow-lg relative">
                <div className="text-sm opacity-80 font-medium">Coming Soon</div>
                <div className="text-4xl font-extrabold mt-1">N/A</div>
                <Settings className="absolute bottom-4 right-4 opacity-20" size={48} />
              </div>
            </div>

            {/* Active Check-In Details Section */}
            <h3 className="text-xl font-bold text-gray-800 pt-8 mb-4 border-t border-gray-100 mt-8">Active Check-Ins</h3>
            <div className="space-y-6">
                {liveData.activeEvents && liveData.activeEvents.length > 0 ? (
                    liveData.activeEvents.map(event => (
                        <div key={event.eventId} className="border border-blue-200 rounded-lg p-5 bg-blue-50 shadow-md">
                            <div className="flex justify-between items-center mb-3 border-b pb-2">
                                <h4 className="text-xl font-semibold text-blue-800">{event.eventName}</h4>
                                <span className="text-lg font-bold text-blue-600">
                                    {event.currentAttendance} Checked In
                                </span>
                            </div>
                            <p className="text-sm text-gray-600 mb-3">
                                <span className="font-medium">Location:</span> {event.location}
                                <br />
                                <span className="font-medium">Start Time:</span> {new Date(event.startTime).toLocaleString()}
                            </p>
                            
                            <h5 className="font-semibold text-gray-700 mt-4 mb-2">Checked-in Students:</h5>
                            {event.students && event.students.length > 0 ? (
                                <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
                                    {/* Iterating over the students list (now correctly populated) */}
                                    {event.students.map(student => (
                                        <div key={student.personId} className="bg-white p-3 rounded-lg shadow-sm border border-gray-100">
                                            <p className="font-medium text-sm">
                                                {student.firstName} {student.lastName}
                                            </p>
                                        </div>
                                    ))}
                                </div>
                            ) : (
                                <p className="text-gray-500 italic text-sm">No students currently checked in.</p>
                            )}
                        </div>
                    ))
                ) : (
                    <p className="text-gray-500 text-center py-8 text-lg">No events currently active with check-ins.</p>
                )}
            </div>
            
          </div>
        </div>
      );
    };

    // ************************************************************
    // Students View - REFACTORED TO USE GRAPHQL
    // ************************************************************
    const StudentsView = () => {
      const [students, setStudents] = useState([]);
      const [loading, setLoading] = useState(false);
      const [selectedStudent, setSelectedStudent] = useState(null);
      const [parents, setParents] = useState([]);

      useEffect(() => {
        fetchStudents();
      }, []);

      const fetchStudents = async () => {
        setLoading(true);
        const query = `
          query AllStudents {
            students {
              personId
              firstName
              lastName
              email
              phone
              birthday
            }
          }
        `;
        try {
          const data = await graphqlFetch(query);
          // FIX: Mapping is not strictly needed if fields match camelCase, but ensure access
          setStudents(data.students || []); 
        } catch (err) {
          console.error('Error fetching students:', err);
        }
        setLoading(false);
      };

      const viewStudentParents = async (studentId) => {
        setParents([]);
        // NOTE: Assuming studentParents resolver exists on Query
        const query = ` 
          query StudentParents($id: Int!) {
            studentParents(studentId: $id) {
              personId
              firstName
              lastName
              email
              phone
            }
          }
        `;
        try {
          const data = await graphqlFetch(query, { id: studentId });
          setParents(data.studentParents || []);
          setSelectedStudent(studentId);
        } catch (err) {
          console.error('Error fetching parents:', err);
        }
      };
      
      const selectedStudentData = students.find(s => s.personId === selectedStudent);
      
      return (
        <div className="bg-white shadow-xl rounded-xl p-6">
          <div className="flex items-center gap-3 mb-4">
            <Users className="text-blue-600" size={32} />
            <h2 className="text-2xl font-bold text-gray-800">Students ({students.length})</h2>
          </div>
          
          {loading ? (
            <p className="text-center py-8 text-gray-500">Loading...</p>
          ) : (
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
              {/* Student List */}
              <div className="lg:col-span-2">
                <div className="max-h-[60vh] overflow-y-auto space-y-3 pr-4">
                  {students.map(student => (
                    <div key={student.personId} 
                      className={`p-4 rounded-lg border cursor-pointer transition-all ${
                        student.personId === selectedStudent 
                          ? 'bg-blue-200 border-blue-600 shadow-lg' // SELECTED: Darker Blue
                          : 'bg-blue-50 border-blue-200 hover:bg-blue-100' // DEFAULT: Light Blue
                      }`}
                      onClick={() => viewStudentParents(student.personId)}
                    >
                      <div className="font-semibold text-gray-800">{student.firstName} {student.lastName}</div>
                      <div className="text-sm text-gray-500">{student.email}</div>
                    </div>
                  ))}
                </div>
              </div>

              {/* Detail/Parents Panel */}
              <div className="bg-gray-100 p-4 rounded-lg shadow-inner">
                <h3 className="text-xl font-bold text-gray-800 mb-3">Student Details</h3>
                {selectedStudentData ? (
                  <div className="space-y-3">
                    <p className="font-semibold">{selectedStudentData.firstName} {selectedStudentData.lastName}</p>
                    <p className="text-sm">Email: {selectedStudentData.email}</p>
                    <p className="text-sm">Phone: {selectedStudentData.phone}</p>
                    <p className="text-sm">Birthday: {selectedStudentData.birthday || 'N/A'}</p>
                    
                    <h4 className="font-bold pt-3 border-t mt-3">Parents ({parents.length})</h4>
                    <div className="space-y-2">
                      {parents.map(parent => (
                        <div key={parent.personId} className="p-3 bg-green-50 rounded-lg border border-green-200">
                          <p className="font-semibold text-sm">{parent.firstName} {parent.lastName}</p>
                          <p className="text-xs text-gray-600">{parent.phone}</p>
                        </div>
                      ))}
                    </div>
                  </div>
                ) : (
                  <p className="text-gray-500 text-center py-8">Select a student to view details.</p>
                )}
              </div>
            </div>
          )}
        </div>
      );
    };
    
    // ************************************************************
    // Parents View - REFACTORED TO USE GRAPHQL AND FILTER DATA
    // ************************************************************
    const ParentsView = () => {
      const [parents, setParents] = useState([]);
      const [loading, setLoading] = useState(false);
      const [selectedParent, setSelectedParent] = useState(null);
      const [children, setChildren] = useState([]);

      useEffect(() => {
        fetchParents();
      }, []);

      const fetchParents = async () => {
        setLoading(true);
        // FIX: Changed query from generic 'people' to dedicated 'parents'
        // This relies on the backend to correctly filter for people with children.
        const query = `
          query AllParents {
            parents {
              personId
              firstName
              lastName
              email
              phone
              birthday
            }
          }
        `;
        try {
          const data = await graphqlFetch(query);
          // FIX: Now expecting 'parents' field from GraphQL response
          const formattedParents = (data.parents || []).map(p => ({
              id: p.personId,
              firstName: p.firstName,
              lastName: p.lastName,
              email: p.email,
              phone: p.phone,
          }));
          setParents(formattedParents);
        } catch (err) {
          console.error('Error fetching parents:', err);
        }
        setLoading(false);
      };

      const viewParentChildren = async (parentId) => {
        setChildren([]);
        // NOTE: Assuming parentChildren resolver exists on Query
        const query = `
          query ParentChildren($id: Int!) {
            parentChildren(parentId: $id) {
              personId
              firstName
              lastName
              email
            }
          }
        `;
        try {
          const data = await graphqlFetch(query, { id: parentId });
          setChildren(data.parentChildren || []);
          setSelectedParent(parentId);
        } catch (err) {
          console.error('Error fetching children:', err);
        }
      };

      const selectedParentData = parents.find(p => p.id === selectedParent);

      return (
        <div className="bg-white shadow-xl rounded-xl p-6">
          <div className="flex items-center gap-3 mb-4">
            <UserPlus className="text-blue-600" size={32} />
            <h2 className="text-2xl font-bold text-gray-800">Parents ({parents.length})</h2>
          </div>
          
          {loading ? (
            <p className="text-center py-8 text-gray-500">Loading...</p>
          ) : (
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
              {/* Parent List */}
              <div className="lg:col-span-2">
                <div className="max-h-[60vh] overflow-y-auto space-y-3 pr-4">
                  {parents.map(parent => (
                    <div key={parent.id} 
                      className={`p-4 rounded-lg border cursor-pointer transition-all ${
                        parent.id === selectedParent 
                          ? 'bg-green-200 border-green-600 shadow-lg' // SELECTED: Darker Green
                          : 'bg-green-50 border-green-200 hover:bg-green-100' // DEFAULT: Light Green
                      }`}
                      onClick={() => viewParentChildren(parent.id)}
                    >
                      <div className="font-semibold text-gray-800">{parent.firstName} {parent.lastName}</div>
                      <div className="text-sm text-gray-500">{parent.email}</div>
                    </div>
                  ))}
                </div>
              </div>

              {/* Detail/Children Panel */}
              <div className="bg-gray-100 p-4 rounded-lg shadow-inner">
                <h3 className="text-xl font-bold text-gray-800 mb-3">Parent Details</h3>
                {selectedParentData ? (
                  <div className="space-y-3">
                    <p className="font-semibold">{selectedParentData.firstName} {selectedParentData.lastName}</p>
                    <p className="text-sm">Email: {selectedParentData.email}</p>
                    <p className="text-sm">Phone: {selectedParentData.phone}</p>
                    
                    <h4 className="font-bold pt-3 border-t mt-3">Children ({children.length})</h4>
                    <div className="space-y-2">
                      {children.map(child => (
                        <div key={child.personId} className="p-3 bg-blue-50 rounded-lg border border-blue-200">
                          <p className="font-semibold text-sm">{child.firstName} {child.lastName}</p>
                          <p className="text-xs text-gray-600">{child.email}</p>
                        </div>
                      ))}
                    </div>
                  </div>
                ) : (
                  <p className="text-gray-500 text-center py-8">Select a parent to view details.</p>
                )}
              </div>
            </div>
          )}
        </div>
      );
    };

    // ************************************************************
    // Events View - REFACTORED TO USE GRAPHQL
    // ************************************************************
    const EventsView = () => {
      const [events, setEvents] = useState([]);
      const [loading, setLoading] = useState(false);
      const [selectedEvent, setSelectedEvent] = useState(null);
      const [registrations, setRegistrations] = useState([]);

      useEffect(() => {
        fetchEvents();
      }, []);

      const fetchEvents = async () => {
        setLoading(true);
        const query = `
          query AllEvents {
            events {
              eventId
              eventName
              location
              startDateTime
            }
          }
        `;
        try {
          const data = await graphqlFetch(query);
          const formattedEvents = (data.events || []).map(e => ({
              id: e.eventId,
              name: e.eventName,
              location: e.location,
              dateTime: e.startDateTime,
          }));
          setEvents(formattedEvents);
          // Auto-select the first event if available
          if (formattedEvents.length > 0) {
            viewEventRegistrations(formattedEvents[0].id);
          }
        } catch (err) {
          console.error('Error fetching events:', err);
        }
        setLoading(false);
      };

      const viewEventRegistrations = async (eventId) => {
        setRegistrations([]);
        // NOTE: Assuming eventRegistrations resolver exists on Query
        const query = `
          query EventRegistrations($id: Int!) {
            eventRegistrations(eventId: $id) { # FIX: Function name and argument
              personId 
              firstName
              lastName
              email
            }
          }
        `;
        try {
          const data = await graphqlFetch(query, { id: eventId });
          // CRITICAL: Update mapping to use camelCase from the server response
          const registrationsData = (data.eventRegistrations || []).map(p => ({
              id: p.personId,
              firstName: p.firstName,
              lastName: p.lastName,
              email: p.email,
              registrationDate: new Date().toISOString(),
          }));
          setRegistrations(registrationsData);
          setSelectedEvent(eventId);
        } catch (err) {
          console.error('Error fetching registrations:', err);
        }
      };

      const registerForEvent = async (eventId, personId) => {
        const mutation = `
          mutation Register($eventId: Int!, $personId: Int!) {
            registerForEvent(eventId: $eventId, personId: $personId) # FIX: Function name and arguments
          }
        `;
        try {
          await graphqlFetch(mutation, { eventId, personId });
          // Re-fetch registrations to update the list
          viewEventRegistrations(eventId);
        } catch (err) {
          console.error('Error registering:', err);
        }
      };
      
      const selectedEventData = events.find(e => e.id === selectedEvent);

      return (
        <div className="bg-white shadow-xl rounded-xl p-6">
          <div className="flex items-center gap-3 mb-4">
            <Calendar className="text-blue-600" size={32} />
            <h2 className="text-2xl font-bold text-gray-800">Events ({events.length})</h2>
          </div>
          
          {loading ? (
            <p className="text-center py-8 text-gray-500">Loading...</p>
          ) : (
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
              {/* Event List */}
              <div className="lg:col-span-2">
                <div className="max-h-[60vh] overflow-y-auto space-y-3 pr-4">
                  {events.map(event => (
                    <div key={event.id} 
                      className={`p-4 rounded-lg border cursor-pointer transition-all ${
                        event.id === selectedEvent ? 'bg-blue-100 border-blue-400 shadow-md' : 'bg-gray-50 border-gray-200 hover:bg-gray-100'
                      }`}
                      onClick={() => viewEventRegistrations(event.id)}
                    >
                      <div className="font-semibold text-gray-800">{event.name}</div>
                      <div className="text-sm text-gray-500">{event.location} &bull; {new Date(event.dateTime).toLocaleString()}</div>
                    </div>
                  ))}
                </div>
              </div>

              {/* Detail/Registration Panel */}
              <div className="bg-gray-100 p-4 rounded-lg shadow-inner">
                <h3 className="text-xl font-bold text-gray-800 mb-3">Event Details</h3>
                {selectedEventData ? (
                  <div className="space-y-3">
                    <p className="font-semibold">{selectedEventData.name}</p>
                    <p className="text-sm">Location: {selectedEventData.location}</p>
                    <p className="text-sm">Date/Time: {new Date(selectedEventData.dateTime).toLocaleString()}</p>
                    
                    <h4 className="font-bold pt-3 border-t mt-3">Registered People ({registrations.length})</h4>
                    <div className="space-y-2 max-h-60 overflow-y-auto">
                      {registrations.map(person => (
                        <div key={person.id} className="p-3 bg-white rounded-lg border border-gray-200">
                          <p className="font-semibold text-sm">{person.firstName} {person.lastName}</p>
                          <p className="text-xs text-gray-600">{person.email}</p>
                        </div>
                      ))}
                    </div>
                  </div>
                ) : (
                  <p className="text-gray-500 text-center py-8">Select an event to view registrations.</p>
                )}
              </div>
            </div>
          )}
        </div>
      );
    };

    // ************************************************************
    // Check-In View - REFACTORED TO USE GRAPHQL
    // ************************************************************
    const CheckInView = ({ onRefresh }) => {
      const [events, setEvents] = useState([]);
      const [students, setStudents] = useState([]);
      const [selectedEvent, setSelectedEvent] = useState(null);
      const [checkinStatus, setCheckinStatus] = useState(null);
      const [message, setMessage] = useState('');
      const [loading, setLoading] = useState(false);

      useEffect(() => {
        fetchEvents();

    // =================================================================
    // EventConfigView Component (Custom Data Management)
    // =================================================================
    const EventConfigView = ({ events, selectedEvent }) => {
        const [schemas, setSchemas] = useState([]);
        const [message, setMessage] = useState('');
        
        // State for NEW EVENT TYPE CREATION (Feature 2)
        const [newTypeId, setNewTypeId] = useState('');
        const [newFields, setNewFields] = useState([{ name: '', type: 'text' }]); // [{name: 'fieldName', type: 'text|number|boolean'}]

        // State for NEW EVENT CUSTOM DATA ENTRY (Feature 1)
        const [selectedSchema, setSelectedSchema] = useState(null);
        const [customDataValues, setCustomDataValues] = useState({});
        const [eventForCustomData, setEventForCustomData] = useState('');


        const graphqlFetch = async (query, variables = {}) => {
            const response = await fetch(`${API_BASE}/graphql`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query, variables }),
            });
            const result = await response.json();
            if (result.errors) {
                throw new Error(result.errors.map(e => e.message).join(' | '));
            }
            return result.data;
        };

        const fetchEventTypeSchemas = useCallback(async () => {
            const query = `
                query GetEventTypeSchemas {
                    eventTypeSchemas {
                        eventTypeId
                        fields {
                            name
                            type
                        }
                    }
                }
            `;
            try {
                const data = await graphqlFetch(query);
                setSchemas(data.eventTypeSchemas || []);
            } catch (err) {
                setMessage(`Error fetching schemas: ${err.message}`);
            }
        }, []);

        useEffect(() => {
            fetchEventTypeSchemas();
            // Automatically select the currently selected event for Custom Data entry
            if (selectedEvent && events.length > 0) {
                const event = events.find(e => e.eventId === parseInt(selectedEvent));
                if (event) {
                    setEventForCustomData(selectedEvent);
                    const eventTypeSchema = schemas.find(s => s.eventTypeId === event.eventTypeId);
                    setSelectedSchema(eventTypeSchema || null);
                    // Initialize custom data values based on the schema
                    if (eventTypeSchema) {
                        setCustomDataValues(eventTypeSchema.fields.reduce((acc, field) => {
                            acc[field.name] = '';
                            return acc;
                        }, {}));
                    } else {
                        setCustomDataValues({});
                    }
                }
            } else {
                setEventForCustomData('');
                setSelectedSchema(null);
                setCustomDataValues({});
            }
        }, [selectedEvent, events, schemas.length]); // Re-fetch schemas when a new event is selected or schemas change

        // --- HANDLERS for New Event Type Schema (Feature 2) ---

        const handleAddField = () => {
            setNewFields([...newFields, { name: '', type: 'text' }]);
        };

        const handleFieldChange = (index, field, value) => {
            const updatedFields = [...newFields];
            updatedFields[index][field] = value;
            setNewFields(updatedFields);
        };

        const handleRemoveField = (index) => {
            const updatedFields = newFields.filter((_, i) => i !== index);
            setNewFields(updatedFields);
        };

        const createEventTypeSchema = async () => {
            if (!newTypeId || newFields.some(f => !f.name.trim())) {
                setMessage('Please provide an Event Type ID and names for all custom fields.');
                return;
            }
            
            const mutation = `
                mutation CreateEventTypeSchema($input: EventTypeSchemaInput!) {
                    createEventTypeSchema(input: $input) {
                        eventTypeId
                    }
                }
            `;
            const variables = {
                input: {
                    eventTypeId: parseInt(newTypeId),
                    fields: newFields.map(f => ({ name: f.name.trim(), type: f.type }))
                }
            };

            try {
                await graphqlFetch(mutation, variables);
                setMessage(`✓ Event Type Schema for ID ${newTypeId} created successfully!`);
                setNewTypeId('');
                setNewFields([{ name: '', type: 'text' }]);
                fetchEventTypeSchemas(); // Refresh schemas list
                setTimeout(() => setMessage(''), 3000);
            } catch (err) {
                setMessage(`Error creating event type schema: ${err.message}`);
                setTimeout(() => setMessage(''), 5000);
            }
        };


        // --- HANDLERS for Adding Custom Data to Existing Event (Feature 1) ---

        const handleEventSelectForCustomData = (eventId) => {
            setEventForCustomData(eventId);
            const event = events.find(e => e.eventId === parseInt(eventId));
            if (event) {
                const eventTypeSchema = schemas.find(s => s.eventTypeId === event.eventTypeId);
                setSelectedSchema(eventTypeSchema || null);
                // Initialize values
                if (eventTypeSchema) {
                    setCustomDataValues(eventTypeSchema.fields.reduce((acc, field) => {
                        acc[field.name] = '';
                        return acc;
                    }, {}));
                } else {
                    setCustomDataValues({});
                }
            } else {
                setSelectedSchema(null);
                setCustomDataValues({});
            }
        };

        const handleCustomDataValueChange = (key, value, type) => {
            // Simple type coercion for the form
            let parsedValue = value;
            if (type === 'number') parsedValue = isNaN(parseFloat(value)) ? null : parseFloat(value);
            if (type === 'boolean') parsedValue = (value === 'true' || value === true);

            setCustomDataValues(prev => ({
                ...prev,
                [key]: parsedValue
            }));
        };

        const addEventCustomData = async () => {
            if (!eventForCustomData || !selectedSchema) {
                setMessage('Please select an event with a defined schema.');
                return;
            }

            // Transform customDataValues into the required format for the mutation
            const customDataList = Object.entries(customDataValues).map(([key, value]) => ({
                key,
                value: String(value) // Store all values as strings for flexibility, server handles parsing
            }));

            const mutation = `
                mutation AddEventCustomData($input: EventCustomDataInput!) {
                    addEventCustomData(input: $input) {
                        eventId
                        customData {
                            key
                            value
                        }
                    }
                }
            `;
            const variables = {
                input: {
                    eventId: parseInt(eventForCustomData),
                    customData: customDataList
                }
            };

            try {
                await graphqlFetch(mutation, variables);
                setMessage(`✓ Custom Data added/updated for Event ${eventForCustomData} successfully!`);
                setCustomDataValues({}); // Clear values after successful submission
                setTimeout(() => setMessage(''), 3000);
            } catch (err) {
                setMessage(`Error adding custom data: ${err.message}`);
                setTimeout(() => setMessage(''), 5000);
            }
        };

        return (
            <div className="p-6 bg-white shadow-xl rounded-xl">
                <h2 className="text-2xl font-extrabold text-teal-700 mb-6 flex items-center">
                    <Activity className="w-6 h-6 mr-3" /> Event Configuration (MongoDB/GraphQL)
                </h2>

                {message && (
                    <div className={`p-3 mb-4 rounded-lg ${message.startsWith('✓') ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}`}>
                        {message}
                    </div>
                )}
                
                {/* --- FEATURE 2: Create New Event Type Schema --- */}
                <div className="mb-8 p-6 border-2 border-blue-200 rounded-lg bg-blue-50">
                    <h3 className="text-xl font-bold text-blue-700 mb-4">2. Create New Event Type Schema</h3>
                    
                    <div className="mb-4">
                        <label className="block text-sm font-medium text-gray-700 mb-1">New Event Type ID</label>
                        <input
                            type="number"
                            value={newTypeId}
                            onChange={(e) => setNewTypeId(e.target.value)}
                            placeholder="e.g., 501"
                            className="w-full p-2 border rounded-md focus:ring-blue-500 focus:border-blue-500"
                        />
                        <p className="text-xs text-gray-500 mt-1">This ID must be unique and correspond to a MySQL Event Type.</p>
                    </div>

                    <h4 className="text-lg font-semibold text-gray-700 mt-6 mb-3 border-b pb-1">Define Custom Fields</h4>
                    
                    <div className="space-y-3">
                        {newFields.map((field, index) => (
                            <div key={index} className="flex space-x-2 items-center bg-white p-3 border rounded-md shadow-sm">
                                <input
                                    type="text"
                                    value={field.name}
                                    onChange={(e) => handleFieldChange(index, 'name', e.target.value)}
                                    placeholder="Field Name (e.g., BusRoute)"
                                    className="flex-grow p-2 border rounded-md"
                                />
                                <select
                                    value={field.type}
                                    onChange={(e) => handleFieldChange(index, 'type', e.target.value)}
                                    className="p-2 border rounded-md"
                                >
                                    <option value="text">Text</option>
                                    <option value="number">Number</option>
                                    <option value="boolean">Boolean</option>
                                </select>
                                <button 
                                    onClick={() => handleRemoveField(index)}
                                    className="text-red-500 hover:text-red-700 p-2"
                                >
                                    ❌
                                </button>
                            </div>
                        ))}
                    </div>
                    
                    <div className="flex justify-between mt-4">
                        <button 
                            onClick={handleAddField}
                            className="px-3 py-1 text-sm bg-gray-200 text-gray-700 rounded-md hover:bg-gray-300 transition-colors"
                        >
                            + Add Field
                        </button>
                        <button
                            onClick={createEventTypeSchema}
                            className="bg-blue-600 text-white px-4 py-2 rounded-lg font-semibold hover:bg-blue-700 transition-colors disabled:bg-gray-400"
                            disabled={!newTypeId.trim() || newFields.some(f => !f.name.trim())}
                        >
                            Create Schema
                        </button>
                    </div>
                </div>

                {/* --- FEATURE 1: Add Custom Data to Event --- */}
                <div className="p-6 border-2 border-teal-200 rounded-lg bg-teal-50">
                    <h3 className="text-xl font-bold text-teal-700 mb-4">1. Add Custom Data to Event</h3>
                    
                    {/* Event Selection Dropdown */}
                    <div className="mb-4">
                        <label className="block text-sm font-medium text-gray-700 mb-1">Select Event</label>
                        <select
                            value={eventForCustomData}
                            onChange={(e) => handleEventSelectForCustomData(e.target.value)}
                            className="w-full p-2 border rounded-md focus:ring-teal-500 focus:border-teal-500 bg-white"
                        >
                            <option value="">-- Select an Event --</option>
                            {events.map(event => (
                                <option key={event.eventId} value={event.eventId}>
                                    {event.eventName} (ID: {event.eventId}) - Type ID: {event.eventTypeId}
                                </option>
                            ))}
                        </select>
                    </div>

                    {selectedSchema && selectedSchema.fields.length > 0 ? (
                        <>
                            <h4 className="text-lg font-semibold text-gray-700 mt-6 mb-3 border-b pb-1">
                                Custom Fields for Type ID: {selectedSchema.eventTypeId}
                            </h4>
                            
                            <div className="space-y-3">
                                {selectedSchema.fields.map((field) => (
                                    <div key={field.name} className="p-3 border rounded-md bg-white shadow-sm">
                                        <label className="block text-sm font-medium text-gray-700 mb-1">
                                            {field.name} ({field.type})
                                        </label>
                                        {/* Dynamic Input Rendering */}
                                        {field.type === 'boolean' ? (
                                            <select
                                                value={customDataValues[field.name]}
                                                onChange={(e) => handleCustomDataValueChange(field.name, e.target.value, field.type)}
                                                className="w-full p-2 border rounded-md"
                                            >
                                                <option value="">-- Select --</option>
                                                <option value="true">True</option>
                                                <option value="false">False</option>
                                            </select>
                                        ) : (
                                            <input
                                                type={field.type === 'number' ? 'number' : 'text'}
                                                value={customDataValues[field.name] || ''}
                                                onChange={(e) => handleCustomDataValueChange(field.name, e.target.value, field.type)}
                                                placeholder={`Enter value for ${field.name}`}
                                                className="w-full p-2 border rounded-md focus:ring-teal-500 focus:border-teal-500"
                                            />
                                        )}
                                    </div>
                                ))}
                            </div>

                            <button
                                onClick={addEventCustomData}
                                className="w-full bg-teal-600 text-white px-4 py-2 rounded-lg font-semibold hover:bg-teal-700 transition-colors disabled:bg-gray-400 mt-6"
                                disabled={!eventForCustomData || Object.values(customDataValues).some(v => v === '' || v === null)}
                            >
                                Save Custom Data
                            </button>
                        </>
                    ) : (
                        <p className="text-gray-500 mt-4">
                            Select an event. The selected event's type must have a defined custom schema.
                        </p>
                    )}
                </div>
            </div>
        );
    };

    // Final rendering call
    const rootElement = document.getElementById('root');
    if (rootElement) {
        ReactDOM.createRoot(rootElement).render(React.createElement(YouthGroupApp));
    }
    </script>
</body>
</html>
